spring.application.name=KhangGearVer2
spring.datasource.url=${SQLSERVER_URL:}
spring.datasource.username=${SQLSERVER_USERNAME:}
spring.datasource.password=${SQLSERVER_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mail.host=${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:${SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=${MAIL_FROM_NAME:KHANGGEAR}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
