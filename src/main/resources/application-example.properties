# Copy to application-local.properties and replace placeholders locally.
spring.datasource.url=jdbc:sqlserver://<host>:<port>;databaseName=<database>;encrypt=true;trustServerCertificate=true
spring.datasource.username=<username>
spring.datasource.password=<password>
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from-name=${MAIL_FROM_NAME:KHANGGEAR}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
